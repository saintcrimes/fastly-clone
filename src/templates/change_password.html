<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fastly | Reset your password</title>
<style>
  :root{
    --bg: #000000;
    --card-bg: #0c0c0d;
    --card-border: #2a2a2d;
    --text: #e4e4e7;
    --text-dim: #9a9aa2;
    --fastly-red: #ff282d;
    --link-blue: #5b8def;
    --focus-ring: #5b8def;
    --input-bg: #131316;
    --input-border: #3a3a3f;
    --error: #ff5c5c;
    --success: #3ecf8e;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:40px 40px 32px;
  }

  .heading{ font-size:20px; font-weight:700; margin-bottom:6px; }
  .subtext{ font-size:13px; color:var(--text-dim); margin-bottom:28px; }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }

  .field{ margin-bottom:18px; }

  input[type="password"]{
    width:100%;
    padding:11px 12px;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:5px;
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{
    border-color:var(--focus-ring);
    box-shadow:0 0 0 3px rgba(91,141,239,0.15);
  }
  input.invalid{ border-color:var(--error); }
  input.valid{ border-color:var(--success); }

  .hint{
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .hint.error{ color:var(--error); }

  button{
    width:100%;
    padding:11px 0;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:1px solid transparent;
    background:var(--link-blue);
    color:#fff;
    margin-top:6px;
    transition:opacity .15s ease, background-color .15s ease;
  }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button:not(:disabled):hover{ background:#4b7bd6; }

  .message{
    font-size:13px;
    padding:10px 12px;
    border-radius:5px;
    margin-top:18px;
    display:none;
    line-height:1.5;
  }
  .message.show{ display:block; }
  .message.error{ background:rgba(255,92,92,0.1); color:var(--error); }
  .message.success{ background:rgba(62,207,142,0.1); color:var(--success); }

  a{ color:var(--link-blue); text-decoration:none; font-size:13px; }
  a:hover{ text-decoration:underline; }

  .footer-link{ text-align:center; margin-top:20px; }
</style>
</head>
<body>

  <div class="card">
    <div class="heading">Reset your password</div>
    <div class="subtext" id="subtext">Enter a new password for your account.</div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <div class="hint" id="passwordHint">At least 8 characters, one uppercase letter, one number.</div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <div class="hint error" id="matchHint" style="display:none;">Passwords do not match.</div>
      </div>

      <button type="submit" id="submitBtn" disabled>Change password</button>
    </form>

    <div class="message" id="messageBox"></div>

    <div class="footer-link">
      <a href="/signin">Back to log in</a>
    </div>
  </div>

<script>
(function(){
  const form            = document.getElementById('resetForm');
  const passwordEl      = document.getElementById('password');
  const confirmEl       = document.getElementById('confirmPassword');
  const submitBtn       = document.getElementById('submitBtn');
  const passwordHint    = document.getElementById('passwordHint');
  const matchHint       = document.getElementById('matchHint');
  const messageBox      = document.getElementById('messageBox');
  const subtext         = document.getElementById('subtext');

  const CHANGE_PASSWORD_ENDPOINT = '/v1/change_password';

  // --- Read the reset token from the URL the confirm-link redirected to ---
  // e.g. /change_password?token=eyJ...
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token){
    showMessage('This reset link is invalid or missing. Please request a new one.', 'error');
    form.querySelectorAll('input, button').forEach(el => el.disabled = true);
    subtext.textContent = '';
  }

  function showMessage(text, type){
    messageBox.textContent = text;
    messageBox.className = `message show ${type}`;
  }

  function clearMessage(){
    messageBox.className = 'message';
    messageBox.textContent = '';
  }

  const strongEnough = v => v.length >= 8 && /[A-Z]/.test(v) && /[0-9]/.test(v);

  function validateForm(){
    const pw = passwordEl.value;
    const confirm = confirmEl.value;

    const pwValid = strongEnough(pw);
    passwordEl.classList.toggle('invalid', pw.length > 0 && !pwValid);
    passwordEl.classList.toggle('valid', pwValid);
    passwordHint.classList.toggle('error', pw.length > 0 && !pwValid);

    const matches = confirm.length === 0 || confirm === pw;
    confirmEl.classList.toggle('invalid', confirm.length > 0 && !matches);
    matchHint.style.display = (confirm.length > 0 && !matches) ? 'block' : 'none';

    const formValid = pwValid && confirm.length > 0 && confirm === pw && !!token;
    submitBtn.disabled = !formValid;
    return formValid;
  }

  passwordEl.addEventListener('input', validateForm);
  confirmEl.addEventListener('input', validateForm);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();

    if (!validateForm()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Changing…';

    try {
      const response = await fetch(
        `${CHANGE_PASSWORD_ENDPOINT}?token=${encodeURIComponent(token)}`,
        {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordEl.value })
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok){
        throw new Error(extractErrorMessage(data));
      }

      showMessage('Password changed successfully. You can now log in.', 'success');
      form.reset();
      form.querySelectorAll('input, button').forEach(el => el.disabled = true);

      setTimeout(() => { window.location.href = '/signin'; }, 2000);

    } catch (err){
      showMessage(err.message || 'Something went wrong. Please try again.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Change password';
    }
  });

  function extractErrorMessage(data){
    if (!data || !data.detail) return 'Something went wrong. Please try again.';
    if (Array.isArray(data.detail)){
      return data.detail.map(e => e.msg || 'Invalid input').join(' ');
    }
    return String(data.detail);
  }
})();
</script>

</body>
</html>
