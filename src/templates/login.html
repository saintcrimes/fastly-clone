<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fastly | Log in</title>
<style>
  :root{
    --bg: #000000;
    --card-bg: #0c0c0d;
    --card-border: #2a2a2d;
    --text: #e4e4e7;
    --text-dim: #9a9aa2;
    --fastly-red: #ff282d;
    --link-blue: #5b8def;
    --focus-ring: #5b8def;
    --input-bg: #131316;
    --input-border: #3a3a3f;
    --error: #ff5c5c;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:40px 40px 32px;
  }

  .logo{ text-align:center; margin-bottom:32px; }
  .logo span{
    font-size:32px;
    font-weight:800;
    letter-spacing:-0.5px;
    color:var(--fastly-red);
    font-style:italic;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  label .req{ color:var(--fastly-red); }

  .field{ margin-bottom:18px; }

  input[type="text"],
  input[type="password"]{
    width:100%;
    padding:11px 12px;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:5px;
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{
    border-color:var(--focus-ring);
    box-shadow:0 0 0 3px rgba(91,141,239,0.15);
  }
  input.invalid{ border-color:var(--error); }

  .btn-row{ display:flex; gap:10px; margin-top:24px; }
  button{
    flex:1;
    padding:11px 0;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:1px solid transparent;
    transition:opacity .15s ease, background-color .15s ease;
  }
  .btn-primary{
    background:#3a3a3f;
    color:var(--text);
    border-color:#4a4a50;
  }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ background:#46464c; }

  .btn-secondary{
    background:transparent;
    color:var(--link-blue);
    border-color:var(--link-blue);
  }
  .btn-secondary:hover{ background:rgba(91,141,239,0.08); }

  .forgot{ text-align:center; margin-top:18px; }
  a{ color:var(--link-blue); text-decoration:none; font-size:13px; }
  a:hover{ text-decoration:underline; }

  .legal{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:22px;
    line-height:1.5;
  }

  .signup-row{
    text-align:center;
    margin-top:32px;
    font-size:14px;
    color:var(--text-dim);
  }
  .signup-row a{ font-size:14px; font-weight:600; }

  .form-error{
    font-size:13px;
    color:var(--error);
    margin-top:10px;
    display:none;
  }
  .form-error.show{ display:block; }

  footer{
    margin-top:48px;
    display:flex;
    gap:16px;
    align-items:center;
    font-size:12px;
    color:var(--text-dim);
  }
  footer a{ font-size:12px; color:var(--text-dim); }
  footer .sep{ color:var(--card-border); }
  .copyright{ margin-top:8px; font-size:12px; color:var(--text-dim); }
</style>
</head>
<body>

  <div class="card">
    <div class="logo"><span>fastly.</span></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Email <span class="req">*</span></label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="form-error" id="formError"></div>

      <div class="btn-row">
        <button type="submit" class="btn-primary" id="loginBtn" disabled>Log in</button>
        <button type="button" class="btn-secondary" id="backBtn">Back</button>
      </div>
    </form>

    <div class="forgot">
      <a href="/password_forgot">Forgot password</a>
    </div>

    <div class="legal">
      By continuing, you agree to the <a href="/terms">Terms of Service</a> and
      acknowledge our <a href="/privacy">Privacy Policy</a>
    </div>
  </div>

  <div class="signup-row">
    Don't have an account? <a href="/signup">Sign up &rsaquo;</a>
  </div>

  <footer>
    <a href="/terms">Fastly Terms of Service</a>
    <span class="sep">|</span>
    <a href="/privacy">Privacy policy</a>
    <span class="sep">|</span>
    <a href="/status">Fastly status</a>
  </footer>
  <div class="copyright">Copyright &copy; 2026 Fastly Inc. All Rights Reserved.</div>

<script>
(function(){
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const loginBtn   = document.getElementById('loginBtn');
  const form       = document.getElementById('loginForm');
  const formError  = document.getElementById('formError');
  const backBtn    = document.getElementById('backBtn');

  // Backend endpoints
  const LOGIN_ENDPOINT = '/signin';
  const BACK_URL       = '/password_forgot';
  const SIGNUP_URL     = '/signup';

  document.querySelector('.signup-row a').setAttribute('href', SIGNUP_URL);

  // Login just needs non-empty fields — no strength checking here,
  // that belongs on signup/reset, not on an existing password.
  function validateForm(){
    const usernameOk = usernameEl.value.trim().length > 0;
    const passwordOk = passwordEl.value.length > 0;

    usernameEl.classList.toggle('invalid', usernameEl.value.length > 0 && !usernameOk);

    loginBtn.disabled = !(usernameOk && passwordOk);
  }

  usernameEl.addEventListener('input', validateForm);
  passwordEl.addEventListener('input', validateForm);

  backBtn.addEventListener('click', () => {
    window.location.href = BACK_URL;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.remove('show');

    if (loginBtn.disabled) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';

    try {
      const res = await fetch(LOGIN_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: usernameEl.value.trim(),
          password: passwordEl.value
        })
      });

      if (!res.ok){
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || 'Invalid email or password.');
      }

      window.location.href = '/dashboard';

    } catch (err){
      formError.textContent = err.message || 'Something went wrong. Please try again.';
      formError.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
    }
  });
})();
</script>

</body>
</html>
